name: Refresh data and deploy chart

on:
  push:
  workflow_dispatch:
  schedule:
    # UTC. Once daily at 09:00 Korea time (08:00 Beijing).
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages-chart
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run data validation tests
        run: python -m unittest discover -s tests -v

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Read the last published dataset
        env:
          CHART_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          target = Path(os.environ['RUNNER_TEMP']) / 'previous-data.json'
          url = os.environ['CHART_BASE_URL'].rstrip('/') + '/data.json?check=' + str(int(time.time()))
          request = Request(url, headers={'User-Agent': 'CSI300-Wind-Chart/1.0', 'Cache-Control': 'no-cache'})
          try:
              with urlopen(request, timeout=30) as response:
                  content = response.read(5_000_001)
              if len(content) > 5_000_000:
                  raise ValueError('Published dataset exceeds expected size')
              payload = json.loads(content)
              if payload.get('schema_version') != 1 or not payload.get('data'):
                  raise ValueError('Published dataset has an unexpected schema')
              target.write_bytes(content)
              print('Comparing new data with the published dataset through', payload['as_of'])
          except HTTPError as error:
              if error.code != 404:
                  raise
              target.write_bytes(Path('site/data.json').read_bytes())
              print('No published dataset yet; using the bundled snapshot as the minimum history')
          PY

      - name: Fetch and validate both index histories
        run: python scripts/update_data.py --output site/data.json --previous "$RUNNER_TEMP/previous-data.json"

      - name: Write run summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('site/data.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Index chart update\n\n')
              summary.write('Latest common data date: **' + data['as_of'] + '**\n\n')
              summary.write('Aligned observations: **' + str(len(data['data'])) + '**\n\n')
              summary.write('Data fetched at: ' + data['generated_at'] + '\n')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
